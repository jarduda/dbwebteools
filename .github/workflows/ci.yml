name: Validate and package
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: ci-disposable-root
          MARIADB_DATABASE: dbweb_tests
        ports: ['3306:3306']
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      MARIADB_TEST_CONNECTION: Server=127.0.0.1;Port=3306;Database=dbweb_tests;User ID=root;Password=ci-disposable-root;SslMode=Disabled
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: ./scripts/build.sh
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - name: Seed browser test fixture
        run: >-
          docker exec ${{ job.services.mariadb.id }} mariadb -uroot -pci-disposable-root dbweb_tests -e
          "CREATE TABLE browser_records (id INT AUTO_INCREMENT PRIMARY KEY, name VARCHAR(100) NOT NULL, email VARCHAR(150), status VARCHAR(30) DEFAULT 'active'); CREATE TABLE lookup_people (id BIGINT PRIMARY KEY, name VARCHAR(100) NOT NULL, email VARCHAR(100)); INSERT INTO lookup_people VALUES (9007199254740993,'Alice Friendly','alice.lookup@example.test'),(42,'Bob Friendly','bob.lookup@example.test'); CREATE TABLE lookup_orders (id INT AUTO_INCREMENT PRIMARY KEY, title VARCHAR(100) NOT NULL, person_id BIGINT NULL, FOREIGN KEY (person_id) REFERENCES lookup_people(id));"
      - run: npx playwright test
        working-directory: frontend
      - run: npm audit --prefix frontend --omit=dev --audit-level=high
      - uses: actions/upload-artifact@v4
        with:
          name: deployment-and-test-results
          path: artifacts/
  containers:
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        component: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.component }}/Dockerfile
          push: ${{ startsWith(github.ref, 'refs/tags/v') }}
          tags: ghcr.io/${{ github.repository }}-${{ matrix.component }}:${{ github.sha }}
